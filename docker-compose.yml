# Entorno aislado (sandbox) para probar el backend con Postman/Newman y Jenkins.
# Uso: docker compose up -d --build --wait
services:
  backend:
    build: .
    image: solobino-backend:sandbox
    container_name: solobino-sandbox
    ports:
      - "8000:8000"
    env_file:
      - .env.sandbox
    volumes:
      # Cachea el modelo Whisper descargado entre reinicios.
      - whisper-cache:/home/solobino/.cache/huggingface
    restart: unless-stopped

volumes:
  whisper-cache:
